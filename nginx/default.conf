# =========================================================
#  Nginx - Proxy inverso del Parcial II
#  Este archivo se carga dentro del bloque http {} de
#  /etc/nginx/nginx.conf
# =========================================================

# ---------------------------------------------------------
# 1. Identificar a que servicio va cada peticion (para el log)
# ---------------------------------------------------------
map $uri $servicio {
    ~^/jupyter   jupyter;
    ~^/grafana   grafana;
    default      joomla;
}

# ---------------------------------------------------------
# 2. Formato de log CSV (lo leeran PostgreSQL, Grafana y Jupyter)
#    fecha, ip, metodo, uri, protocolo, codigo, bytes,
#    tiempo, servicio, user_agent
# ---------------------------------------------------------
log_format csv_log '"$time_iso8601","$remote_addr","$request_method",'
                   '"$request_uri","$server_protocol",$status,'
                   '$body_bytes_sent,$request_time,"$servicio",'
                   '"$http_user_agent"';

# ---------------------------------------------------------
# 3. Soporte de WebSocket (HTTP Upgrade)
#    Si el cliente pide "Upgrade: websocket" -> Connection: upgrade
#    Si no lo pide                          -> Connection: close
# ---------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

server {
    listen 80;
    server_name _;

    # DNS embebido de Docker: resuelve "joomla", "jupyter", "grafana"
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirecciones relativas (no reescribe host ni puerto)
    absolute_redirect off;

    # Permite subir archivos de hasta 64 MB a Joomla
    client_max_body_size 64m;

    # --- Registro de accesos ---
    access_log /dev/stdout combined;                  # visible con "docker logs"
    access_log /var/log/nginx/trafico.csv csv_log;    # archivo compartido
    error_log  /dev/stderr warn;

    # --- Cabeceras que Nginx inyecta hacia los servicios (Capa 7) ---
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # --- Healthcheck interno de Nginx ---
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Joomla (raiz del sitio) ---
    location / {
        set $destino_joomla http://joomla:80;
        proxy_pass $destino_joomla;
    }

    # --- Jupyter (con WebSockets para el kernel) ---
    location = /jupyter {
        return 301 /jupyter/;
    }
    location /jupyter/ {
        set $destino_jupyter http://jupyter:8888;
        proxy_pass $destino_jupyter;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- Grafana ---
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        set $destino_grafana http://grafana:3000;
        proxy_pass $destino_grafana;
    }
}
