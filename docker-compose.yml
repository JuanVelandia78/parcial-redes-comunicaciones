# ==========================================================
#  Parcial II - Comunicaciones
#  Orquestacion de 5 servicios: nginx, joomla, database,
#  jupyter y grafana
# ==========================================================

name: parcial

services:

  # --------------------------------------------------------
  # 1. Nginx - Proxy inverso (UNICO puerto publicado)
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      joomla:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # 2. CMS Joomla (frontend + backend)
  # --------------------------------------------------------
  joomla:
    image: joomla:latest
    container_name: joomla
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Conexion a PostgreSQL
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_HOST: database
      JOOMLA_DB_NAME: ${POSTGRES_DB}
      JOOMLA_DB_USER: ${POSTGRES_USER}
      JOOMLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JOOMLA_DB_PREFIX: ${JOOMLA_DB_PREFIX}
      # Instalacion automatica (sin asistente web)
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
    volumes:
      - joomla_data:/var/www/html
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # --------------------------------------------------------
  # 3. Base de datos PostgreSQL (solo red interna)
  # --------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------
  # 4. Jupyter - Entorno de analisis de datos
  # --------------------------------------------------------
  jupyter:
    build: ./jupyter
    image: parcial-jupyter:1.0
    container_name: jupyter
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    command: >
      start-notebook.py
      --ServerApp.base_url=/jupyter/
      --ServerApp.root_dir=/home/jovyan/work
      --ServerApp.default_url=/lab/tree/analisis_datos.ipynb
      --ServerApp.trust_xheaders=True
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      # Datos de conexion que usara el cuaderno
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PREFIX: ${JOOMLA_DB_PREFIX}
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
      - nginx_logs:/home/jovyan/logs:ro
    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-frontend
    ipam:
      config:
        - subnet: 172.20.0.0/24

  backend_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-backend
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  db_data:
  joomla_data:
  grafana_data:
  nginx_logs:
